# Button Game under https://babuni.dev/Buttongame/ and https://www.babuni.dev/Buttongame/
#
# Installed by server/install-on-server.sh as /etc/nginx/snippets/buttongame-locations.conf
# and included in the existing HTTPS babuni.dev server block, before its
# catch-all `location /` — the same way as the Morkahja snippet.
# The game server listens on 127.0.0.1:8787 only (buttongame.service).

location = /Buttongame  { return 301 /Buttongame/$is_args$args; }
location = /buttongame  { return 301 /Buttongame/$is_args$args; }
location = /buttongame/ { return 301 /Buttongame/$is_args$args; }

location ^~ /Buttongame/ {
    proxy_pass http://127.0.0.1:8787;   # no URI part: the /Buttongame/ prefix is kept
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The website's server block already adds these to every response.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cache-Control;    # server block sends no-cache
    client_max_body_size 8k;
}
